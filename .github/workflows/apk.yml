name: apk
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - run: npx cap add android
      - name: Kamera izni ve simge
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />\n    <application#' $M
          grep -n "uses-permission" $M
      - run: npx cap sync android
      - name: Sabit imza (güncellemeler üstüne kurulsun)
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - name: APK derle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Sürüme yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KaloriVision.apk
          gh release delete apk-test -y --cleanup-tag || true
          gh release create apk-test KaloriVision.apk --title "KaloriVision APK (test)" --notes "Test APK. Telefona indirip kur."
